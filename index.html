<script>
/* ================= Speicher (localStorage mit Fallback) ================= */
const store = (() => {
  let mem = {};
  const canLS = (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })();
  const get = k => { try { return canLS ? JSON.parse(localStorage.getItem(k)) : (mem[k] ?? null); } catch(e){ return null; } };
  const set = (k,v) => { try { if (canLS) localStorage.setItem(k, JSON.stringify(v)); else mem[k]=v; } catch(e){ mem[k]=v; } };
  const del = k => { try { if (canLS) localStorage.removeItem(k); else delete mem[k]; } catch(e){ delete mem[k]; } };

  let sets = get("pt_sets") || {};
  if (!sets[DEFAULT_SET.id]) { sets[DEFAULT_SET.id] = DEFAULT_SET; set("pt_sets", sets); }
  else { sets[DEFAULT_SET.id] = DEFAULT_SET; } // eingebettetes Set immer aktuell halten
  let currentId = get("pt_current") || DEFAULT_SET.id;
  if (!sets[currentId]) currentId = DEFAULT_SET.id;

  function cur(){ return sets[currentId]; }
  function progKey(){ return "pt_prog_" + currentId; }
  function prog(){ return get(progKey()) || { items:{}, answers:0, correct:0 }; }
  function saveProg(p){ set(progKey(), p); }
  function record(itemId, ok){
    const p = prog();
    const it = p.items[itemId] || { r:0, w:0 };
    ok ? it.r++ : it.w++;
    it.lastWrong = !ok;
    p.items[itemId] = it;
    p.answers++; if (ok) p.correct++;
    saveProg(p);
  }
  function resetProg(){ if (confirm("Alle gespeicherten Lernstände für dieses Fragenset löschen?")) { del(progKey()); ui.showTab("progress"); } }

  function validateSet(s){
    if (!s || typeof s !== "object") return "Keine gültige JSON-Struktur.";
    if (!s.id || !s.title) return "Es fehlen die Felder 'id' oder 'title'.";
    if (!Array.isArray(s.topics) || !s.topics.length) return "Es fehlt die Liste 'topics'.";
    if (!Array.isArray(s.statements)) s.statements = [];
    if (!Array.isArray(s.mcQuestions)) s.mcQuestions = [];
    if (!s.statements.length && !s.mcQuestions.length) return "Das Set enthält weder 'statements' noch 'mcQuestions'.";
    for (const q of s.mcQuestions) {
      if (!Array.isArray(q.options) || q.options.length < 2) return "Frage '" + (q.id||"?") + "' hat zu wenige Optionen.";
      const c = q.options.filter(o=>o.correct).length;
      if (c < 1) return "Frage '" + (q.id||"?") + "' hat keine richtige Option.";
    }
    s.config = Object.assign({ examQuestions:35, examMinutes:60, passPercent:60, topicSimQuestions:20 }, s.config||{});
    return null;
  }
  function importFile(input){
    const f = input.files && input.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let s; try { s = JSON.parse(r.result); } catch(e){ alert("Die Datei ist kein gültiges JSON: " + e.message); input.value=""; return; }
      const err = validateSet(s);
      if (err) { alert("Import abgelehnt: " + err); input.value=""; return; }
      sets[s.id] = s; set("pt_sets", sets);
      currentId = s.id; set("pt_current", currentId);
      input.value = "";
      renderSetSelect(); ui.applySetHeader(); ui.showTab("training");
      alert("Fragenset „" + s.title + "“ importiert und aktiviert.");
    };
    r.readAsText(f);
  }
  function switchSet(id){ if (sets[id]) { currentId = id; set("pt_current", id); ui.applySetHeader(); ui.showTab("training"); } }
  function deleteSet(id){
    if (id === DEFAULT_SET.id) { alert("Das eingebaute Demo-Set kann nicht gelöscht werden."); return; }
    if (!confirm("Fragenset und zugehörigen Lernstand löschen?")) return;
    delete sets[id]; set("pt_sets", sets); del("pt_prog_"+id);
    if (currentId === id) currentId = DEFAULT_SET.id; set("pt_current", currentId);
    renderSetSelect(); ui.applySetHeader(); ui.showTab("training");
  }
  function renderSetSelect(){
    const sel = document.getElementById("setSelect");
    sel.innerHTML = Object.values(sets).map(s => `<option value="${s.id}" ${s.id===currentId?"selected":""}>${esc(s.subtitle || s.title)}</option>`).join("");
  }
  return { cur, prog, record, resetProg, importFile, switchSet, deleteSet, renderSetSelect, get currentId(){ return currentId; } };
})();

function esc(t){ const d=document.createElement("div"); d.textContent=t==null?"":String(t); return d.innerHTML; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function topicName(id){ const t = store.cur().topics.find(t=>t.id===id); return t ? t.name : id; }

/* ================= UI ================= */
const ui = (() => {
  const main = () => document.getElementById("main");
  let view = { name:"training-home" };
  let session = null;   // laufende Trainings-/Prüfungssitzung
  let timerInt = null;

  function applySetHeader(){
    const s = store.cur();
    document.getElementById("setSubtitle").textContent = s.subtitle || s.title;
  }

  function showTab(tab){
    stopTimer();
    document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected","false"));
    document.getElementById("tab-"+tab).setAttribute("aria-selected","true");
    if (tab==="training") trainingHome();
    if (tab==="exam") examHome();
    if (tab==="progress") progressView();
    window.scrollTo(0,0);
  }

  /* ---------- Training: Richtig oder Falsch ---------- */
  function trainingHome(){
    const s = store.cur(), p = store.prog();
    const wrongIds = s.statements.filter(st => p.items[st.id] && p.items[st.id].lastWrong).map(st=>st.id);
    view = { name:"training-home" };
    const chips = s.topics.map(t => {
      const n = s.statements.filter(st=>st.topic===t.id).length;
      return n ? `<button class="chip" onclick="ui.startTraining('${t.id}')">${esc(t.name)} · ${n}</button>` : "";
    }).join("");
    main().innerHTML = `
      <div class="card">
        <div class="eyebrow">Training · Richtig oder falsch?</div>
        <h2>Jede Aussage einzeln bewerten</h2>
        <p class="lead">In der Prüfung kostet ein einziger falscher Haken den ganzen Punkt. Hier trainierst du genau diese Fähigkeit: jede Aussage für sich beurteilen, mit sofortiger Erklärung.</p>
        <div class="chips">${chips}</div>
        <button class="btn btn-primary" onclick="ui.startTraining('__all')">Training starten · ${s.statements.length} Aussagen</button>
        ${wrongIds.length ? `<button class="btn btn-secondary" style="margin-left:8px" onclick="ui.startTraining('__wrong')">Fehler wiederholen · ${wrongIds.length}</button>` : ""}
        <p class="kbd-hint">Tastatur: <kbd>J</kbd> Ja · <kbd>N</kbd> Nein · <kbd>Enter</kbd> Weiter</p>
      </div>`;
  }

  function startTraining(topic){
    const s = store.cur(), p = store.prog();
    let pool = s.statements;
    let label = "Alle Themengebiete";
    if (topic === "__wrong") { pool = pool.filter(st => p.items[st.id] && p.items[st.id].lastWrong); label = "Fehler wiederholen"; }
    else if (topic !== "__all") { pool = pool.filter(st=>st.topic===topic); label = topicName(topic); }
    if (!pool.length) return;
    session = { kind:"training", label, items: shuffle(pool), idx:0, right:0, wrong:0, answered:false };
    renderTraining();
  }

  function renderTraining(){
    const st = session.items[session.idx];
    view = { name:"training-run" };
    main().innerHTML = `
      <div class="card">
        <div class="meta-line">
          <button class="back" onclick="ui.showTab('training')">&lsaquo; Auswahl</button>
          <span>${esc(session.label)}</span>
          <span>Aussage ${session.idx+1} / ${session.items.length} · <span class="nums"><span class="g">${session.right} richtig</span> · <span class="r">${session.wrong} falsch</span></span></span>
        </div>
        <div class="progressbar"><div style="width:${(session.idx/session.items.length)*100}%"></div></div>
        ${st.context ? `<div class="statement">${esc(st.context)}</div>` : ""}
        <div class="qtext">${esc(st.question)}</div>
        <div id="tfButtons">
          <button class="opt" id="btnJ" onclick="ui.answerTF(true)">Ja, richtig<span class="key">Taste J</span></button>
          <button class="opt" id="btnN" onclick="ui.answerTF(false)">Nein, falsch<span class="key">Taste N</span></button>
        </div>
        <div id="tfFeedback"></div>
      </div>`;
  }

  function answerTF(val){
    if (session.answered) return;
    session.answered = true;
    const st = session.items[session.idx];
    const ok = (val === st.answer);
    ok ? session.right++ : session.wrong++;
    store.record(st.id, ok);
    document.getElementById("btnJ").disabled = true;
    document.getElementById("btnN").disabled = true;
    (st.answer ? document.getElementById("btnJ") : document.getElementById("btnN")).classList.add("reveal-correct");
    if (!ok) (val ? document.getElementById("btnJ") : document.getElementById("btnN")).classList.add("reveal-wrong");
    document.getElementById("tfFeedback").innerHTML = `
      <div class="feedback ${ok?"ok":"err"}">
        <strong>${ok ? "✓ Richtig beantwortet." : "✗ Leider falsch."}</strong>
        ${esc(st.explanation || "")}
      </div>
      <button class="btn btn-primary" onclick="ui.nextTraining()">Weiter <span style="font-weight:400;font-size:13px">(Enter)</span></button>`;
  }

  function nextTraining(){
    if (!session.answered) return;
    session.answered = false;
    session.idx++;
    if (session.idx >= session.items.length) return trainingResult();
    renderTraining();
  }

  function trainingResult(){
    view = { name:"training-done" };
    const pct = session.items.length ? Math.round(session.right / session.items.length * 100) : 0;
    main().innerHTML = `
      <div class="card result-big">
        <div class="eyebrow">Training abgeschlossen</div>
        <div class="pct">${pct}%</div>
        <p class="lead">${session.right} von ${session.items.length} Aussagen richtig bewertet (${esc(session.label)}).</p>
        <button class="btn btn-primary" onclick="ui.showTab('training')">Zur Auswahl</button>
        <button class="btn btn-ghost" onclick="ui.showTab('progress')">Fortschritt ansehen</button>
      </div>`;
  }

  /* ---------- Prüfungsmodus ---------- */
  function examHome(){
    const s = store.cur(), c = s.config;
    view = { name:"exam-home" };
    const chips = s.topics.map(t => {
      const n = s.mcQuestions.filter(q=>q.topic===t.id).length;
      return n ? `<button class="chip" onclick="ui.startExam('${t.id}')">${esc(t.name)} · ${n}</button>` : "";
    }).join("");
    main().innerHTML = `
      <div class="card">
        <div class="eyebrow">Themen-Simulation · ${c.topicSimQuestions} Fragen</div>
        <h2>Gezielt nach Themengebiet üben</h2>
        <p class="lead">Mehrfachauswahl mit Alles-oder-nichts: Den Punkt gibt es nur, wenn du <strong>alle</strong> richtigen Optionen wählst und <strong>keine</strong> falsche. Jede Runde neu zusammengestellt.</p>
        <div class="chips">${chips}</div>
      </div>
      <div class="card">
        <div class="eyebrow">Echte Prüfungssimulation · wie am Prüfungstag</div>
        <h2>${c.examQuestions} Fragen · alle Themengebiete · ${c.examMinutes}-Minuten-Uhr</h2>
        <p class="lead">Bestanden ab <strong>${Math.ceil(c.examQuestions * c.passPercent / 100)} richtigen Fragen (${c.passPercent}%)</strong>, wie in der echten Prüfung. Die Uhr zeigt die Prüfungszeit an, bricht aber nicht ab.</p>
        <button class="btn btn-primary" onclick="ui.startExam('__real')">Echte Prüfung starten · ${Math.min(c.examQuestions, s.mcQuestions.length)} Fragen</button>
        <p class="kbd-hint">Tastatur: <kbd>1</kbd>–<kbd>5</kbd> Option wählen · <kbd>Enter</kbd> Prüfen/Weiter</p>
      </div>`;
  }

  function startExam(topic){
    const s = store.cur(), c = s.config;
    let pool, label, timed = false, count;
    if (topic === "__real") {
      pool = shuffle(s.mcQuestions); count = Math.min(c.examQuestions, pool.length);
      label = "Echte Prüfung"; timed = true;
    } else {
      pool = shuffle(s.mcQuestions.filter(q=>q.topic===topic));
      count = Math.min(c.topicSimQuestions, pool.length);
      label = topicName(topic) + " · Themen-Simulation";
    }
    if (!count) return;
    session = { kind:"exam", label, timed,
      items: pool.slice(0, count).map(q => ({ q, opts: shuffle(q.options), sel: new Set() })),
      idx:0, points:0, revealed:false,
      perTopic:{}, startedAt: Date.now(),
      secondsLeft: timed ? c.examMinutes*60 : null };
    if (timed) startTimer();
    renderExam();
  }

  function startTimer(){
    stopTimer();
    timerInt = setInterval(() => {
      if (!session || session.secondsLeft == null) return stopTimer();
      session.secondsLeft--;
      const el = document.getElementById("examTimer");
      if (el) { el.textContent = fmtTime(session.secondsLeft); el.classList.toggle("low", session.secondsLeft < 300); }
      if (session.secondsLeft <= 0) stopTimer();
    }, 1000);
  }
  function stopTimer(){ if (timerInt) { clearInterval(timerInt); timerInt = null; } }
  function fmtTime(sec){ sec = Math.max(0,sec); const m = Math.floor(sec/60), s = sec%60; return m + ":" + String(s).padStart(2,"0"); }

  function renderExam(){
    const it = session.items[session.idx];
    view = { name:"exam-run" };
    main().innerHTML = `
      <div class="card">
        <div class="meta-line">
          <button class="back" onclick="ui.confirmLeaveExam()">&lsaquo; Auswahl</button>
          <span>${esc(session.label)}</span>
          ${session.timed ? `<span>⏱ <span class="timer ${session.secondsLeft<300?"low":""}" id="examTimer">${fmtTime(session.secondsLeft)}</span></span>` : ""}
          <span>Frage ${session.idx+1} / ${session.items.length} · ${session.points} Punkte</span>
        </div>
        <div class="progressbar"><div style="width:${(session.idx/session.items.length)*100}%"></div></div>
        <div class="qtext">${esc(it.q.question)}</div>
        <p class="lead" style="font-size:13.5px;margin-top:-8px">Eine oder mehrere Antworten sind richtig.</p>
        <div id="optList">
          ${it.opts.map((o,i)=>`
            <button class="opt ${it.sel.has(i)?"selected":""}" id="opt${i}" onclick="ui.toggleOpt(${i})" aria-pressed="${it.sel.has(i)}">
              <span class="mark">${it.sel.has(i)?"☑":"☐"}</span>${esc(o.text)}<span class="key">Taste ${i+1}</span>
            </button>`).join("")}
        </div>
        <div id="examFeedback"></div>
        <button class="btn btn-primary" id="checkBtn" onclick="ui.checkExam()" ${it.sel.size?"":"disabled"}>Antwort prüfen</button>
      </div>`;
  }

  function toggleOpt(i){
    if (session.revealed) return;
    const it = session.items[session.idx];
    it.sel.has(i) ? it.sel.delete(i) : it.sel.add(i);
    const b = document.getElementById("opt"+i);
    b.classList.toggle("selected", it.sel.has(i));
    b.setAttribute("aria-pressed", it.sel.has(i));
    b.querySelector(".mark").textContent = it.sel.has(i) ? "☑" : "☐";
    document.getElementById("checkBtn").disabled = !it.sel.size;
  }

  function checkExam(){
    if (session.revealed) return;
    const it = session.items[session.idx];
    if (!it.sel.size) return;
    session.revealed = true;
    let allOk = true;
    it.opts.forEach((o,i)=>{
      const b = document.getElementById("opt"+i);
      b.disabled = true;
      const chosen = it.sel.has(i);
      if (o.correct) {
        b.classList.add("reveal-correct");
        if (!chosen) { allOk = false; b.querySelector(".mark").textContent = "✓"; }
        else b.querySelector(".mark").textContent = "☑";
      } else if (chosen) {
        b.classList.add("reveal-wrong"); allOk = false; b.querySelector(".mark").textContent = "✗";
      }
      if (o.explanation && (o.correct || chosen)) {
        b.insertAdjacentHTML("beforeend", `<span class="expl">${esc(o.explanation)}${o.correct && !chosen ? " <strong>Diese richtige Option hast du übersehen.</strong>" : ""}</span>`);
      }
    });
    if (allOk) session.points++;
    const tp = it.q.topic;
    session.perTopic[tp] = session.perTopic[tp] || { r:0, n:0 };
    session.perTopic[tp].n++; if (allOk) session.perTopic[tp].r++;
    store.record(it.q.id, allOk);
    document.getElementById("checkBtn").style.display = "none";
    document.getElementById("examFeedback").innerHTML = `
      ${allOk
        ? `<div class="feedback ok"><strong>✓ 1 Punkt.</strong>Alle richtigen Optionen gewählt, keine falsche.</div>`
        : `<div class="feedback err"><strong>0 Punkte, Alles-oder-nichts.</strong>Schon eine übersehene richtige oder eine gewählte falsche Option kostet den ganzen Punkt.</div>`}
      <button class="btn btn-primary" onclick="ui.nextExam()">Weiter <span style="font-weight:400;font-size:13px">(Enter)</span></button>`;
  }

  function nextExam(){
    if (!session.revealed) return;
    session.revealed = false;
    session.idx++;
    if (session.idx >= session.items.length) return examResult();
    renderExam();
  }

  function confirmLeaveExam(){
    if (confirm("Prüfung abbrechen? Der aktuelle Durchlauf geht verloren (bereits geprüfte Antworten bleiben im Fortschritt).")) {
      stopTimer(); showTab("exam");
    }
  }

  function examResult(){
    stopTimer();
    view = { name:"exam-done" };
    const s = store.cur(), c = s.config;
    const n = session.items.length;
    const pct = Math.round(session.points / n * 100);
    const passed = pct >= c.passPercent;
    const usedMin = Math.round((Date.now() - session.startedAt) / 60000);
    const rows = Object.entries(session.perTopic).map(([tp,v]) => `
      <div class="topic-row">
        <div class="name">${esc(topicName(tp))}</div>
        <div class="bar"><div style="width:${v.n?Math.round(v.r/v.n*100):0}%"></div></div>
        <div class="nums">${v.r}/${v.n}</div>
      </div>`).join("");
    main().innerHTML = `
      <div class="card result-big">
        <div class="eyebrow">${esc(session.label)} · Ergebnis</div>
        <div class="pct">${pct}%</div>
        <p class="lead">${session.points} von ${n} Punkten${session.timed ? ` · benötigte Zeit ca. ${usedMin} Min` : ""}${session.timed && session.secondsLeft<=0 ? " · <strong>Zeit war abgelaufen</strong>" : ""}</p>
        ${session.timed ? `<span class="badge ${passed?"pass":"fail"}">${passed ? "✓ Bestanden (ab "+c.passPercent+"%)" : "✗ Nicht bestanden (unter "+c.passPercent+"%)"}</span>` : ""}
      </div>
      <div class="card">
        <h3>Ergebnis je Themengebiet</h3>
        ${rows || "<p class='lead'>,</p>"}
        <div style="margin-top:14px">
          <button class="btn btn-primary" onclick="ui.showTab('exam')">Neue Runde</button>
          <button class="btn btn-ghost" onclick="ui.showTab('progress')">Fortschritt ansehen</button>
        </div>
      </div>`;
  }

  /* ---------- Fortschritt ---------- */
  function progressView(){
    const s = store.cur(), p = store.prog();
    view = { name:"progress" };
    const allItems = [...s.statements, ...s.mcQuestions];
    const done = allItems.filter(it => p.items[it.id]).length;
    const pct = p.answers ? Math.round(p.correct / p.answers * 100) : 0;
    const wrongCount = allItems.filter(it => p.items[it.id] && p.items[it.id].lastWrong).length;
    const rows = s.topics.map(t => {
      const items = allItems.filter(it=>it.topic===t.id);
      const d = items.filter(it=>p.items[it.id]);
      let r=0,w=0; d.forEach(it=>{ r+=p.items[it.id].r; w+=p.items[it.id].w; });
      return `<div class="topic-row">
        <div class="name">${esc(t.name)}</div>
        <div class="bar"><div style="width:${items.length?Math.round(d.length/items.length*100):0}%"></div></div>
        <div class="nums">${d.length}/${items.length} · <span class="g">${r}✓</span> <span class="r">${w}✗</span></div>
      </div>`;
    }).join("");
    main().innerHTML = `
      <div class="card">
        <div class="eyebrow">Dein Fortschritt</div>
        <h2>Wo du stehst</h2>
        <div class="stats-grid">
          <div class="stat"><div class="num">${done}</div><div class="lbl">Items bearbeitet (von ${allItems.length})</div></div>
          <div class="stat"><div class="num">${pct}%</div><div class="lbl">Trefferquote gesamt</div></div>
          <div class="stat"><div class="num">${p.answers}</div><div class="lbl">Antworten insgesamt</div></div>
          <div class="stat"><div class="num">${wrongCount}</div><div class="lbl">offene Fehler</div></div>
        </div>
        ${rows}
        <div style="margin-top:16px">
          ${wrongCount ? `<button class="btn btn-secondary" onclick="ui.showTab('training');ui.startTraining('__wrong')">Fehler wiederholen · ${wrongCount}</button>` : ""}
          <button class="btn btn-ghost danger" onclick="store.resetProg()">Alle gespeicherten Daten löschen</button>
          ${store.currentId !== DEFAULT_SET.id ? `<button class="btn btn-ghost" onclick="store.deleteSet('${store.currentId}')">Dieses Fragenset entfernen</button>` : ""}
        </div>
        <p class="kbd-hint">Diese Statistik existiert nur in deinem Browser. Niemand außer dir kann sie sehen. „Löschen" entfernt sie unwiderruflich von deinem Gerät.</p>
      </div>`;
  }

  /* ---------- Tastatur ---------- */
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
    const k = e.key.toLowerCase();
    if (view.name === "training-run") {
      if (!session.answered && k === "j") { answerTF(true); e.preventDefault(); }
      else if (!session.answered && k === "n") { answerTF(false); e.preventDefault(); }
      else if (session.answered && k === "enter") { nextTraining(); e.preventDefault(); }
    } else if (view.name === "exam-run") {
      if (!session.revealed && k >= "1" && k <= "9") {
        const i = parseInt(k,10)-1;
        if (i < session.items[session.idx].opts.length) { toggleOpt(i); e.preventDefault(); }
      } else if (k === "enter") {
        session.revealed ? nextExam() : checkExam(); e.preventDefault();
      }
    } else if ((view.name === "training-done" || view.name === "exam-done") && k === "enter") {
      showTab(view.name === "training-done" ? "training" : "exam"); e.preventDefault();
    }
  });

  return { showTab, applySetHeader, startTraining, answerTF, nextTraining,
           startExam, toggleOpt, checkExam, nextExam, confirmLeaveExam };
})();

store.renderSetSelect();
ui.applySetHeader();
ui.showTab("training");
</script>
</body>
</html>
